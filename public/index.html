<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AceIntelAgent x402 Runner</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #122033;
      }
      body {
        margin: 0;
      }
      main {
        width: min(980px, calc(100% - 40px));
        margin: 32px auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
      }
      .panel {
        background: #fff;
        border: 1px solid #d9e1ee;
        border-radius: 8px;
        padding: 18px;
        margin-top: 16px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: #526178;
        margin-bottom: 6px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 15px;
        padding: 10px 12px;
      }
      button {
        border: 0;
        border-radius: 6px;
        background: #203a63;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:disabled {
        background: #9aa7bb;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: end;
      }
      .grow {
        flex: 1;
      }
      .status {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .status div {
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 10px;
        background: #f8fafc;
      }
      pre {
        overflow: auto;
        max-height: 460px;
        background: #0f172a;
        color: #d7e3f8;
        padding: 14px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.45;
      }
      .muted {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AceIntelAgent x402 Runner</h1>
      <div class="muted">Runs three AceDataCloud services through x402 using MetaMask. Use a burner wallet only.</div>

      <section class="panel">
        <div class="row">
          <div class="grow">
            <label for="target">Target</label>
            <input id="target" value="OOBE Protocol">
          </div>
          <button id="connect">Connect Wallet</button>
          <button id="run" disabled>Run x402 Demo</button>
        </div>
        <div class="status" id="status"></div>
      </section>

      <section class="panel">
        <label>Trace</label>
        <pre id="trace">{}</pre>
      </section>
    </main>
    <script type="module" src="/browser-x402.bundle.js"></script>
  </body>
</html>
